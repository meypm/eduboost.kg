<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>EduBoost Logo</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F8FF;font-family:Arial,sans-serif}
    .card{background:white;border-radius:28px;padding:40px;box-shadow:0 24px 70px rgba(11,31,68,.12);text-align:center}
    img{width:180px;height:180px}
    h1{color:#081B3D;margin:16px 0 6px}
    p{color:#748199}
  </style>
</head>
<body>
  <div class="card">
    <img src="logo-eduboost.svg" alt="EduBoost logo">
    <h1>EduBoost</h1>
    <p>Уникальный логотип: книга + рост + цифровая система</p>
  </div>
</body>
</html>
